<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="xterm.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  #term { position: absolute; top: 0; right: 0; bottom: 0; left: 0; padding: 2px 2px 2px 4px; }
  .xterm .xterm-viewport { overflow-y: hidden; }
  /* Touches must land on the screen: xterm replaces text spans on every redraw. */
  .xterm-screen { touch-action: none; }
  .xterm-rows, .xterm-rows * { pointer-events: none; }
  #history-view { position: absolute; inset: 0; padding: 2px 2px 2px 4px; background: #000;
    color: #e6e6e6; overflow: hidden; touch-action: none; z-index: 2; }
  #history-rows, #history-rows * { pointer-events: none; white-space: pre; }
  #history-tools { position: absolute; right: 6px; bottom: 6px; background: #222; padding: 4px; }
  #history-tools button { color: #fff; background: #333; border: 1px solid #888; padding: 6px 12px; }
  #history-note { font: 12px sans-serif; margin-right: 8px; }
</style>
</head>
<body>
<div id="term"></div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script src="terminal.js"></script>
</body>
</html>
