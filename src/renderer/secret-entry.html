<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws:"
    />
    <title>Paste secret</title>
  </head>
  <body>
    <form id="entry" class="entry" autocomplete="off" novalidate>
      <h1 class="entry__title">Paste the value of <code id="env"></code></h1>
      <p id="lead" class="entry__lead"></p>
      <input
        id="value"
        class="entry__input"
        type="password"
        autocomplete="off"
        spellcheck="false"
        aria-label="Secret value"
      />
      <p id="error" class="entry__error" role="alert" aria-live="assertive"></p>
      <p class="entry__hint">
        Kept in nodeterm’s memory only, never written to disk, until you quit, close the project or clear it.
        Agent nodes of this project started afterwards receive it.
      </p>
      <div class="entry__actions">
        <button id="cancel" type="button" class="entry__btn">Cancel</button>
        <button id="save" type="submit" class="entry__btn entry__btn--primary" disabled>Keep in memory</button>
      </div>
    </form>
    <script type="module" src="./secret-entry/main.ts"></script>
  </body>
</html>
