<!--
  PLACEHOLDER — this is NOT the official Grok / xAI mark.

  It is a neutral "G" monogram drawn in this app's own line-icon style (16x16 display, 24x24
  viewBox, 1.8 stroke, round caps — see src/renderer/components/icons.tsx). Replace it with the
  official Grok asset from an official press/brand page, kept at its published proportions, when
  one is available. Do not touch it up into something that resembles the official mark.

  Colour is explicit (slate-500, the same #64748b as AGENT_CONFIG.grok) rather than currentColor,
  because agentIcons.tsx loads this file as a URL into an <img>, where currentColor cannot
  inherit the surrounding text colour (claude.svg / opencode.svg carry explicit colours too).
-->
