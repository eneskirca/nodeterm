version: 2
updates:
  # npm dependencies: weekly, grouped so one PR carries the routine bumps instead
  # of a dozen. Security updates still come through as their own PRs immediately.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
    # node-pty / electron are ABI-sensitive (postinstall rebuilds node-pty against
    # Electron's ABI) — take those majors by hand, not on an auto-PR.
    ignore:
      - dependency-name: electron
        update-types: [version-update:semver-major]
      - dependency-name: node-pty
        update-types: [version-update:semver-major]
      # The @xterm family must move in LOCKSTEP, by hand: the addons reach into the core's
      # internals, so an addon bump against an older core crashes at runtime with no compile
      # error. addon-webgl 0.19.0 on the 5.5 core read `_core._store` (a 5.6+ field) in its
      # dispose path and aborted the DOM-renderer restore — every context release left a
      # renderer-less, permanently black terminal (the zoom-out blackout). Guarded by
      # src/renderer/terminal/webgl-addon-pair.test.ts; upgrade the whole family together
      # (next vehicle: the xterm 6.x major).
      - dependency-name: "@xterm/*"

  # Keep the GitHub Actions pinned in the workflows current (security patches to
  # checkout / setup-node / codeql-action land here).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  # The Android companion's Gradle build (audit A69), weekly and grouped like npm: two PRs carry the
  # routine minor/patch bumps (the protocol's network and crypto stack, then everything else; see
  # `groups`), a major (AGP, Kotlin, okhttp, Gradle itself) comes on its own. /android covers
  # the whole build: the app (include(":app")), the protocol module, which is an included build
  # (includeBuild("protocol") in android/settings.gradle.kts; Dependabot follows includeBuild, so it
  # needs no entry of its own, and a second entry for /android/protocol would open each of its bumps
  # twice), and the Gradle wrapper in android/gradle/wrapper. Not android/tools/typecheck: that offline
  # type-check is not run by CI, so a PR against it would be untested, and its pins mirror the app's
  # (Kotlin, BouncyCastle) or stand in for them (Compose Multiplatform desktop for Jetpack Compose,
  # robolectric's android-all for compileSdk 35), so they move by hand with the app's, never to
  # whatever is newest. GradleCiCoverageTest (android/protocol) pins this.
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # The protocol's network and crypto stack (the relay socket, the direct-SSH transport, the phone's
      # Ed25519 identity and the BouncyCastle provider sshj needs on Android) gets a PR of its own. In the
      # catch-all below it would only ever move together with every androidx/Compose/AGP/Kotlin bump, and
      # that PR stays red whenever one of them needs something the build lacks: androidx releases raise
      # the compileSdk their AAR metadata demands, which :app:checkDebugAarMetadata enforces against the
      # app's compileSdk. Nothing of this group would land until someone fixed that by hand. Dependabot
      # gives a dependency matching two groups to the more specific one (these patterns beat "*"), and
      # within a run a group listed earlier handles it first, so keep this group above the catch-all.
      # GradleCiCoverageTest (android/protocol) pins that no other dependency shares its PR.
      protocol-net-crypto:
        patterns:
          - "com.squareup.okhttp3:*"
          - "com.hierynomus:*"
          - "net.i2p.crypto:*"
          - "org.bouncycastle:*"
        update-types: [minor, patch]
      android-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
