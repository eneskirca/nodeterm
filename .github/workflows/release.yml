name: Release

# Build, code-sign, and notarize the macOS app on every version tag (e.g. v0.1.1),
# then publish the artifacts (dmg + zip + latest-mac.yml + blockmaps). Those files
# are what the self-hosted update feed at https://nodeterm.dev/updates serves.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # allow creating the GitHub Release (canonical artifact store)

jobs:
  release-mac:
    # Runs on a SELF-HOSTED Apple Silicon Mac (no GitHub macOS-runner minutes — those are billed
    # 10× and a slow notarization poll can burn hundreds). Everything else is identical: the runner
    # signs + notarizes + publishes the GitHub Release, which nodeterm.dev proxies for downloads and
    # the update feed. The runner checks out into its own _work dir, so it never touches the dev repo.
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          # No `cache: npm` here on purpose: this is the self-hosted Mac runner, whose ~/.npm
          # is already warm across runs. setup-node's post-run cache SAVE step (a tarball upload
          # to GitHub's cache service) bought nothing but failed the whole release-mac job on a
          # network blip — after every asset had uploaded — which skipped the publish gate and
          # stranded v0.2.23 as a prerelease. The ephemeral Linux runner below keeps its cache.

      # caffeinate on EVERY long-running step in this job, not just build+upload: the Air
      # sleeping during npm ci or the tmux compile cancels the step just the same (the
      # v0.3.1 attempt died mid tmux build). -dims only blocks idle sleep — a closed lid
      # still sleeps the machine — but it removes the "opened the lid, walked away" window.
      - name: Install dependencies
        run: caffeinate -dims npm ci

      # The bundled tmux (resources/bin/tmux → <app>/Contents/Resources/bin/tmux via the mac
      # extraResources entry). Without a tmux on the machine the app silently degrades to plain
      # shells — no persistence across restarts, no mobile attach, and a park/dispose kills the
      # agent CLI instead of detaching a client (issue #126). Shipping one removes that for the
      # tmux-less; the SYSTEM tmux still takes precedence at runtime (see findTmux).
      #
      # A SEPARATE STEP, before electron-builder, on purpose: a missing extraResources source is
      # only a WARNING to electron-builder, so a failure folded into the release command could
      # publish a DMG with no tmux in it and nobody would notice. Here a build failure fails the
      # job. Idempotent — a rerun with the binary already present is a no-op, so the retry loop in
      # the next step costs nothing.
      #
      # RUNNER TOOLCHAIN: the Xcode command line tools and nothing else — curl, cc, make, ar, yacc,
      # lipo, strip, otool, nm. Explicitly NOT needed: cmake (utf8proc is built through its plain
      # Makefile, not its CMakeLists), autoconf (release tarballs ship a generated `configure`, and
      # each arch is extracted fresh so no maintainer rule fires), pkg-config (deliberately
      # disabled — a Homebrew .pc file would link the bundle to dylibs users don't have), Homebrew,
      # Rosetta (the cross slice is configured with --host, so no test binary is ever executed) and
      # npm packages (node stdlib only).
      - name: Build bundled tmux (universal, static libevent + utf8proc)
        run: caffeinate -dims node scripts/build-tmux.mjs

      # ELECTRON-BUILDER FLOOR — 26.16.1, and the `^26.16.1` range in package.json is what keeps
      # it. Up to and including 26.16.0, createKeychain generated a random keychain password but
      # then handed `security set-key-partition-list` the P12 password instead
      # (app-builder-lib/out/codeSign/macCodeSign.js: random at :137, wrong one passed at :168).
      # macOS tolerated the mismatch for years; the runner's upgrade to Darwin 27 stopped
      # tolerating it, and every signing run died on
      #   security: SecKeychainUnlock: The user name or passphrase you entered is not correct.
      # — which reads exactly like a bad CSC_* secret and is not one. 26.16.1 threads the real
      # keychain password through. Do not drop below it; note npm's `latest` dist-tag still
      # points at 26.15.3, so `npm i electron-builder@latest` installs the broken one.
      - name: Build, sign & notarize
        run: |
          printf '%s' "$APPLE_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          export APPLE_API_KEY="$RUNNER_TEMP/notary-key.p8"
          # Apple's notarization can take a long time, and @electron/notarize has no retry: a single
          # transient network blip while polling appstoreconnect (NSURLError -1009) fails the whole
          # build even though the submission gets Accepted. Retry the release up to 3 times so one
          # blip during a long poll doesn't sink the release.
          # caffeinate: the runner is a MacBook Air, and idle sleep mid-notarization disconnects
          # the runner — GitHub then marks the job "cancelled" (bit v0.2.16 and v0.2.18). Assert
          # no-sleep for exactly as long as the release command runs.
          n=1
          until caffeinate -dims npm run release; do
            if [ "$n" -ge 3 ]; then
              echo "::error::release failed after $n attempts"
              exit 1
            fi
            echo "::warning::release attempt $n failed (likely transient notarization network error); retrying in 60s…"
            n=$((n + 1))
            sleep 60
          done
        env:
          # Developer ID Application cert, base64-encoded .p12 + its password.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Apple notarization via App Store Connect API key: the .p8 is stored base64-encoded in
          # a secret, decoded to a file at runtime, and its path handed to electron-builder.
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      # NOTE: there is deliberately no actions/upload-artifact step. Each release is ~800 MB of
      # DMGs + zips, and Actions artifact storage is a small, billed quota that those copies filled
      # up (the release then failed with "Artifact storage quota has been hit"). The GitHub Release
      # below is the canonical store — it does not consume that quota — so the extra 90-day copy
      # bought nothing. Don't add it back.

      # Canonical copy of every release on GitHub. The update feed itself lives on
      # nodeterm.dev (see the deploy step below), but keeping a GitHub Release means
      # there is always a downloadable, versioned backup.
      #
      # Shell + `gh release upload --clobber` instead of softprops: uploading ~800 MB from the
      # self-hosted runner hit a mid-upload `write EPIPE` (v0.2.17) that softprops cannot retry,
      # leaving latest-mac.yml pointing at binaries that were never uploaded. --clobber makes
      # every retry idempotent, so a half-uploaded attempt heals on the next one.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep the Air awake for THIS step too. caffeinate wrapped only build+notarize; an
          # ~800MB upload is long enough for idle sleep to disconnect the runner mid-transfer,
          # which cancels the step (v0.2.25) — and a cancel, unlike an error, the retry loop
          # below can't catch. `-w $$` ties the assertion to this shell's lifetime.
          caffeinate -dims -w $$ &
          tag="${GITHUB_REF_NAME}"
          # The linux job may already have created the release for this tag; tolerate the race.
          # Created as PRERELEASE: a half-built release must never become "latest" (the site and
          # the update feed follow /releases/latest). The `publish` job flips it once BOTH
          # platform jobs have uploaded.
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --verify-tag --prerelease --notes "" || true
          n=1
          until gh release upload "$tag" dist/*.dmg dist/*.zip dist/*.yml dist/*.blockmap --clobber --repo "$GITHUB_REPOSITORY"; do
            if [ "$n" -ge 5 ]; then
              echo "::error::asset upload failed after $n attempts"
              exit 1
            fi
            echo "::warning::asset upload attempt $n failed (transient network?); retrying in 30s…"
            n=$((n + 1))
            sleep 30
          done

      # Publish the feed to nodeterm.dev/updates. Fill in for your host. Example for
      # SSH/rsync (store the private key as the DEPLOY_SSH_KEY secret):
      #
      # - name: Deploy update feed to nodeterm.dev
      #   run: |
      #     mkdir -p ~/.ssh && echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
      #     chmod 600 ~/.ssh/id_ed25519
      #     ssh-keyscan nodeterm.dev >> ~/.ssh/known_hosts
      #     rsync -avz dist/*.dmg dist/*.zip dist/*.yml dist/*.blockmap \
      #       deploy@nodeterm.dev:/var/www/nodeterm.dev/updates/

  # Linux build: unsigned, so it runs on a plain GitHub runner (fast + free tier), in
  # parallel with the self-hosted mac job — it must never queue behind notarization.
  # Publishes AppImage + deb + rpm + latest-linux.yml to the SAME tag's GitHub Release; the
  # nodeterm.dev update feed serves latest-linux.yml alongside the mac files.
  release-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # electron-builder ships its own fpm, but the rpm target shells out to the system
      # rpmbuild ("Need executable 'rpmbuild' to convert dir to rpm"). Installed explicitly
      # rather than relying on whatever the runner image happens to carry.
      - name: Install rpmbuild
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux packages
        run: |
          npm run make-icon
          npm run build
          npx electron-builder --linux --publish never

      # Both jobs target the release for the same tag; softprops updates an existing
      # release rather than failing, so mac/linux artifact sets merge. (A same-instant
      # creation race is theoretically possible — rerunning the failed job resolves it.)
      # prerelease: a half-built release must never become "latest" — the `publish` job
      # flips it once both platform jobs are done.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/latest-linux.yml

  # Windows build: UNSIGNED BETA (#454), on a plain GitHub runner. Publishes the NSIS
  # installer + zip + latest.yml as assets on the same tag's GitHub Release. latest.yml is a
  # PASSIVE notice feed only: `dist:win:release` stamps the package `nodeTermUpdates=manual`
  # (see src/shared/update-platform.ts), so the shipped app checks the feed and shows a
  # "new version available — Download" card linking the releases page, but never downloads or
  # installs (quitAndInstall is refused in main). Self-install arrives with code signing; an
  # unsigned auto-update is a trust downgrade. The nodeterm.dev/updates mirror must serve
  # latest.yml the way it serves latest-mac.yml / latest-linux.yml (hosted outside this repo);
  # the `verify-feed` job below reports whether it does.
  #
  # BEST-EFFORT by design: the `publish` promote gate below deliberately does NOT wait on
  # this job, so a Windows failure never strands the mac+linux release as a prerelease. A
  # failed run is rerun and uploads into the (possibly already published) release. Uploads
  # use `gh release upload --clobber` (never softprops) so a late finish can't flip an
  # already-promoted release back to prerelease by re-writing its fields.
  release-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # postinstall patches node-pty and rebuilds node-pty + smart-whisper against Electron's
      # ABI — the same install win-package-smoke.yml and the quality-windows CI job prove green.
      - name: Install dependencies
        run: npm ci

      # make-icon + electron-vite build + electron-builder --win --x64 --publish never, stamped
      # nodeTermUpdates=manual (plain `dist:win` stays `disabled` for local packages that must
      # never poll). Unsigned: no signing secrets exist for Windows yet; SmartScreen will warn.
      - name: Build Windows packages (NSIS installer + zip, unsigned)
        run: npm run dist:win:release

      # The artifact names are the contract (same check as win-package-smoke.yml): a silent
      # target/artifactName regression must fail here, before the upload step lies about it.
      - name: Verify expected artifacts
        shell: bash
        run: |
          ls -la dist
          version=$(node -p "require('./package.json').version")
          test -f "dist/nodeterm-Setup-${version}.exe" || { echo "::error::NSIS installer missing"; exit 1; }
          ls dist/nodeterm-*-win.zip >/dev/null 2>&1 || { echo "::error::win zip missing"; exit 1; }
          test -f dist/latest.yml || { echo "::error::latest.yml (update notice feed) missing"; exit 1; }

      # Deliberately narrow globs: the installer + zip + latest.yml (the passive notice feed).
      # No *.blockmap: differential downloads belong to the self-install story that waits on
      # signing. The feed may briefly name this version before `publish` promotes it — harmless,
      # the card only links the releases page and never downloads a file.
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          # Another platform job may already have created the release for this tag; tolerate
          # the race. Created as PRERELEASE for the same reason the mac job does it — a
          # half-built release must never become "latest"; the `publish` job flips it.
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --verify-tag --prerelease --notes "" || true
          n=1
          until gh release upload "$tag" dist/nodeterm-Setup-*.exe dist/nodeterm-*-win.zip dist/latest.yml --clobber --repo "$GITHUB_REPOSITORY"; do
            if [ "$n" -ge 5 ]; then
              echo "::error::asset upload failed after $n attempts"
              exit 1
            fi
            echo "::warning::asset upload attempt $n failed (transient network?); retrying in 30s…"
            n=$((n + 1))
            sleep 30
          done

  # Flips the release to a published "latest" only when BOTH the mac and linux jobs uploaded
  # their assets. Until then it stays a prerelease, so /releases/latest (the site + both update
  # feeds) keeps serving the previous complete release — a mac-runner sleep or an upload
  # failure can no longer put a partial release in front of users. If one platform job
  # fails, fix/rerun it; this job then runs on the rerun and publishes.
  # release-win is deliberately NOT in `needs`: the Windows asset is an unsigned beta whose feed
  # is a passive notice only, and its failure must never hold the mac+linux release hostage.
  publish:
    runs-on: ubuntu-latest
    needs: [release-mac, release-linux]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags — notes diff against the previous release tag

      # Release notes, in two layers (issue #841). Written BEFORE the promote below, so the
      # release is complete — assets AND notes — the moment it becomes "latest".
      #
      #   Layer 1  scripts/release-notes.mjs asks GitHub's own generator for the PR-resolved
      #            list (PR number, PR title, author) and regroups it into New / Improved /
      #            Fixed, with test/refactor/chore/ci/build collapsed at the bottom — kept, not
      #            deleted. Every entry links its PR, and any issue its title names.
      #   Layer 2  docs/release-notes/<TAG>.md, a hand-written Highlights block reviewed in the
      #            release PR, placed at the top. ABSENT FILE ⇒ THE GROUPED LIST ALONE. No
      #            release is ever blocked waiting for prose, and nobody has to be in the loop.
      #
      # DEGRADES, NEVER FAILS: if the generator throws for any reason (gh api down, a body
      # shape we do not parse, a missing node), the step falls back to EXACTLY the plain
      # `git log` list this release used to publish. A release that cannot publish because
      # prose generation broke would be strictly worse than the list we are replacing.
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          # The range starts at the last release USERS ACTUALLY GOT, not at the last tag. A
          # platform job can fail — v0.3.8's mac job did, after the signing runner's OS upgrade —
          # and that tag then stays a prerelease forever: never promoted, its notes never
          # generated. Diffing the next release against it would publish a changelog containing
          # only the handful of commits since, silently burying everything the stranded tag was
          # carrying. /releases/latest excludes prereleases, which is exactly the question being
          # asked, and this step runs BEFORE the promote below, so it still names the PREVIOUS
          # release. Falls back to the last tag when there is no published release yet, and when
          # a rerun on an already-promoted tag would otherwise diff that tag against itself.
          prev=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [ -z "$prev" ] || [ "$prev" = "$tag" ]; then
            prev=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)
          fi
          if [ -n "$prev" ]; then range="${prev}..${tag}"; else range="${tag}"; fi
          if ! node scripts/release-notes.mjs --tag "$tag" --prev "$prev" \
                 --repo "$GITHUB_REPOSITORY" --out notes.md; then
            echo "::warning::structured release notes failed; falling back to the plain commit list"
            {
              echo "## Changes${prev:+ since ${prev}}"
              git log --no-merges --format='- %s' "$range" | grep -vE '^- chore\(release\)' | head -60
              total=$(git log --no-merges --format='- %s' "$range" | grep -cvE '^- chore\(release\)' || true)
              if [ "${total:-0}" -gt 60 ]; then echo "- …and $((total - 60)) more commits"; fi
            } > notes.md
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file notes.md

      - name: Promote release to latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --prerelease=false --latest

      # Homebrew: the cask is NOT updated from here. It lives in the official homebrew/cask,
      # whose autobump follows /releases/latest — which excludes prereleases, so it only ever
      # picks up a release this publish job has promoted. (nodeterm/homebrew-tap is retired.)

  # The update FEED is what installed apps actually read, and it is not the GitHub Release: the
  # apps poll https://nodeterm.dev/updates (package.json build.publish), a mirror hosted OUTSIDE
  # this repo. Nothing used to check it, which is how latest.yml 404'd there while every job here
  # was green — and a check-only Windows build reports a failed automatic check only in its log, so
  # the passive update notice was dead with no signal anywhere (U2). This job turns that hidden
  # dependency into a visible result, AFTER the release is already promoted: it never holds a
  # release back, a red run is the alarm.
  #
  # STRICT files fail the job when the mirror does not serve this tag's version within the retry
  # window (mirror sync / CDN delay); ADVISORY files only warn. latest.yml is advisory until the
  # mirror is confirmed to serve it — move it to STRICT then. It is checked only when release-win
  # itself succeeded (that job is best-effort and may finish later or need a rerun).
  verify-feed:
    runs-on: ubuntu-latest
    needs: [publish, release-win]
    if: ${{ always() && needs.publish.result == 'success' }}
    steps:
      - name: Verify the update feed serves this release
        env:
          FEED: https://nodeterm.dev/updates
          STRICT: latest-mac.yml latest-linux.yml
          ADVISORY: latest.yml
          WIN_RESULT: ${{ needs.release-win.result }}
        run: |
          want="${GITHUB_REF_NAME#v}"
          fail=0
          check() {
            f="$1"; level="$2"; n=1; got=""
            while [ "$n" -le 10 ]; do
              got=$(curl -fsSL --max-time 20 "$FEED/$f" 2>/dev/null \
                | sed -n 's/^version:[[:space:]]*//p' | head -n 1 | tr -d "\"' \r")
              if [ "$got" = "$want" ]; then
                echo "$FEED/$f serves $got"
                return 0
              fi
              echo "attempt $n: $FEED/$f serves '${got:-<missing>}', want $want; retrying in 30s…"
              n=$((n + 1))
              sleep 30
            done
            echo "::$level::$FEED/$f serves version '${got:-<missing>}', expected $want"
            if [ "$level" = error ]; then fail=1; fi
          }
          for f in $STRICT; do check "$f" error; done
          if [ "$WIN_RESULT" = success ]; then
            for f in $ADVISORY; do check "$f" warning; done
          else
            echo "::warning::release-win result is '$WIN_RESULT'; latest.yml was not checked"
          fi
          exit "$fail"
