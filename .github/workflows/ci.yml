name: CI

# Verify typecheck, tests, and the production build on every PR and push to main.
on:
  # Merge-queue runs: required checks must also report on the queue's synthetic
  # merge commits, or every queued PR times out waiting for them.
  merge_group:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Only PR runs may be cancelled: a cancelled merge_group run strands every PR queued
# behind it, and a cancelled push-to-main run loses that commit's CI signal.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # Skip postinstall's electron-rebuild (node-pty + whisper.cpp). Tests need neither the
      # Electron build nor smart-whisper, but many suites import node-pty at runtime, so it is
      # rebuilt for Node from the patched sources (Windows takes its shipped prebuild). The patch step
      # also writes the markers src/main/node-pty-patch.test.ts asserts.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Patch node-pty sources
        run: node scripts/patch-node-pty.mjs

      - name: Build node-pty and link esbuild
        run: npm rebuild node-pty esbuild

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build (electron-vite)
        run: npm run build

  # Windows is becoming a supported target (extraction from #276). The full suite still contains
  # POSIX-shaped fixtures (/bin/sh, AF_UNIX binds), so this job runs the suites whose behaviour is
  # platform-dependent and worth proving on the real platform — the atomic-write retry exists FOR
  # Windows and is inert on the Linux job above. Widen the file list as Windows support lands
  # (session host, shell profiles); the goal is that it converges on `npm test`.
  quality-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Verify Visual Studio C++ toolchain
        shell: cmd
        run: call "%GITHUB_WORKSPACE%\bootstrap-windows.bat" --check-vs-build-tools

      # Skip postinstall's electron-rebuild (node-pty + whisper.cpp). Tests need neither the
      # Electron build nor smart-whisper, but many suites import node-pty at runtime, so it is
      # rebuilt for Node from the patched sources (Windows takes its shipped prebuild). The patch step
      # also writes the markers src/main/node-pty-patch.test.ts asserts.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Patch node-pty sources
        run: node scripts/patch-node-pty.mjs

      - name: Build node-pty and link esbuild
        run: npm rebuild node-pty esbuild

      - name: Type check
        run: npm run typecheck

      - name: Build session host
        run: npm run host:build

      - name: Windows-relevant tests
        run: npx vitest run src/core/windows-delivery-safety.test.ts src/core/settled-text.test.ts src/core/native-windows-pane.test.ts src/core/phone-approval.test.ts src/main/remote/standing-host.test.ts src/main/remote/approved-devices.test.ts src/renderer/lib/phone-approval.test.ts src/core/fs-atomic.test.ts src/core/fs-atomic.guard.test.ts src/core/exec-path.test.ts src/core/claude-cli.test.ts src/core/codex-identity-caps.test.ts src/core/codex-cli.test.ts src/core/grok-cli.test.ts src/core/commit-message.test.ts src/core/context-link.windows.test.ts src/core/git-service.windows.test.ts src/core/usage/codex-usage.windows.test.ts src/session-host/ src/core/session-host-client.test.ts src/core/session-host-launch-ledger.test.ts src/core/session-host-client-startup-wait.test.ts src/core/agent-launch.test.ts src/core/pty-session-host.test.ts src/main/bootstrap-windows.test.ts src/main/media-protocol.test.ts src/main/remote-atomic-write.test.ts src/main/ssh-fs.test.ts src/main/remote-ssh/ssh-project.test.ts src/renderer/terminal/file-links.test.ts src/renderer/terminal/file-links.windows.test.ts src/renderer/terminal/file-link-dialect.test.ts src/renderer/terminal/host-platform.test.ts src/main/pairing-service.windows.test.ts src/main/windows-ssh-keys.test.ts src/shared/pairing-gate.test.ts src/renderer/components/settings/sections/PhoneSection.windows.test.tsx scripts/windows-update-preflight.test.ts
