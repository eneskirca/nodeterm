name: Windows package smoke

# Manual-only packaging smoke test for the Windows target (groundwork from #276 / #300 stack):
# proves that `electron-builder --win` produces an NSIS installer + zip from a clean checkout on
# windows-latest, whose runner image already ships the Visual Studio Build Tools + Python that
# node-pty/smart-whisper compilation needs.
#
# BUILD ONLY — this workflow must NEVER publish. `dist:win` passes `--publish never`, nothing
# here uploads to the update feed or creates a release, and the produced installer is unsigned.
# The session-host phase (#305) has merged and release.yml's `release-win` job now ships this
# same build as an UNSIGNED BETA on every version tag (#454), via `dist:win:release`, which adds a
# passive update-notice feed (latest.yml, `nodeTermUpdates=manual`: check only, never install).
# Still deliberate follow-ups: code signing, and — gated on it — Windows self-install;
# an unsigned auto-update is a trust downgrade, and this smoke build (`dist:win`) never polls.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # postinstall patches node-pty and rebuilds node-pty + smart-whisper against Electron's
      # ABI — the same install the quality-windows CI job already proves green on this image.
      - name: Install dependencies
        run: npm ci

      # make-icon (build/icon.png + build/icon.ico) + electron-vite build + electron-builder
      # --win --x64 --publish never. Unsigned by design: no signing secrets are exposed here.
      - name: Package (NSIS installer + zip, never published)
        run: npm run dist:win

      # The artifact names are the contract: a silent target/artifactName regression should
      # fail here, not on a release day.
      - name: Verify expected artifacts
        shell: bash
        run: |
          ls -la dist
          version=$(node -p "require('./package.json').version")
          test -f "dist/nodeterm-Setup-${version}.exe" || { echo "::error::NSIS installer missing"; exit 1; }
          ls dist/nodeterm-*-win.zip >/dev/null 2>&1 || { echo "::error::win zip missing"; exit 1; }
